<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Search-aware v2 final evaluation comparison</title>
  <desc id="desc">Two-seed exact match and seed2026 search behavior comparison between Clean GRPO and Aware-v2.</desc>
  <rect width="960" height="560" fill="#fbfcfe"/>
  <style>
    text{font-family:Inter,Arial,"Noto Sans SC",sans-serif;fill:#172033} .h{font-size:24px;font-weight:700}.s{font-size:14px;fill:#526079}.l{font-size:13px}.v{font-size:13px;font-weight:700}.axis{stroke:#cbd3df;stroke-width:1}.grid{stroke:#e7ebf1;stroke-width:1}.clean{fill:#62748e}.aware{fill:#17a589}.bad{fill:#d66b5d}.linec{fill:none;stroke:#62748e;stroke-width:3}.linea{fill:none;stroke:#17a589;stroke-width:3}
  </style>
  <text class="h" x="40" y="42">最终评测：EM 未稳定提升，搜索行为稳定改善</text>
  <text class="s" x="40" y="68">official-confirm256-v1 · greedy · real Wiki-18 · max_steps=4</text>

  <text x="40" y="110" font-size="17" font-weight="700">两组种子 EM（%）</text>
  <line class="axis" x1="80" y1="300" x2="440" y2="300"/>
  <line class="grid" x1="80" y1="125" x2="440" y2="125"/><text class="l" x="48" y="130">32</text>
  <line class="grid" x1="80" y1="180" x2="440" y2="180"/><text class="l" x="48" y="185">30</text>
  <line class="grid" x1="80" y1="235" x2="440" y2="235"/><text class="l" x="48" y="240">28</text>
  <line class="grid" x1="80" y1="290" x2="440" y2="290"/><text class="l" x="48" y="295">26</text>
  <polyline class="linec" points="170,210 350,178"/><circle cx="170" cy="210" r="5" fill="#62748e"/><circle cx="350" cy="178" r="5" fill="#62748e"/>
  <polyline class="linea" points="170,221 350,167"/><circle cx="170" cy="221" r="5" fill="#17a589"/><circle cx="350" cy="167" r="5" fill="#17a589"/>
  <text class="v" x="135" y="198">28.91</text><text class="v" x="135" y="240" fill="#17a589">28.52</text>
  <text class="v" x="357" y="183">30.08</text><text class="v" x="357" y="160" fill="#17a589">30.47</text>
  <text class="l" x="145" y="322">seed 1234</text><text class="l" x="325" y="322">seed 2026</text>
  <rect class="clean" x="90" y="345" width="13" height="13"/><text class="l" x="110" y="356">Clean GRPO</text>
  <rect class="aware" x="210" y="345" width="13" height="13"/><text class="l" x="230" y="356">Aware-v2</text>
  <text class="s" x="90" y="382">净差：−1题 / +1题；两次 McNemar p=1.0</text>

  <text x="510" y="110" font-size="17" font-weight="700">seed2026 行为指标（%）</text>
  <line class="axis" x1="650" y1="125" x2="650" y2="415"/>
  <text class="l" x="500" y="158">有效搜索率</text>
  <rect class="clean" x="650" y="140" width="164" height="18"/><rect class="aware" x="650" y="164" width="210" height="18"/>
  <text class="v" x="820" y="154">71.1</text><text class="v" x="866" y="178">91.4</text>
  <text class="l" x="500" y="230">search→answer</text>
  <rect class="clean" x="650" y="212" width="186" height="18"/><rect class="aware" x="650" y="236" width="223" height="18"/>
  <text class="v" x="842" y="226">80.8</text><text class="v" x="879" y="250">97.0</text>
  <text class="l" x="500" y="302">真实冗余率</text>
  <rect class="clean" x="650" y="284" width="46" height="18"/><rect class="aware" x="650" y="308" width="30" height="18"/>
  <text class="v" x="702" y="298">19.9</text><text class="v" x="686" y="322">13.1</text>
  <text class="l" x="500" y="374">四步耗尽（题数）</text>
  <rect class="clean" x="650" y="356" width="140" height="18"/><rect class="bad" x="650" y="380" width="64" height="18"/>
  <text class="v" x="796" y="370">35</text><text class="v" x="720" y="394">16</text>
  <rect class="clean" x="650" y="435" width="13" height="13"/><text class="l" x="670" y="446">Clean</text>
  <rect class="aware" x="730" y="435" width="13" height="13"/><text class="l" x="750" y="446">Aware（耗尽项用红色强调降低）</text>

  <rect x="40" y="474" width="880" height="58" rx="8" fill="#eef6f4"/>
  <text x="60" y="498" font-size="14" font-weight="700">可支持的结论</text>
  <text class="l" x="60" y="520">Aware-v2 改变了搜索与作答策略；当前证据不支持“最终准确率稳定提升”。</text>
</svg>
